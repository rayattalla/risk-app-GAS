<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Risk AI</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:#fafafa;color:#0a0a0a;height:100%}
  @media (prefers-color-scheme: dark){ html,body{background:#0b0d12;color:#f5f5f5} }
  body{display:flex;flex-direction:column;min-height:100vh}
  .brand{padding:36px 16px 8px;text-align:center;flex-shrink:0}
  .brand h1{margin:0;font-size:64px;font-weight:900;letter-spacing:-3.5px;line-height:1}
  .brand h1 em{font-style:normal;color:#dc2626}
  .brand .sub{margin-top:8px;font-size:11px;font-weight:700;letter-spacing:6px;color:rgba(0,0,0,.55);text-transform:uppercase}
  .brand .agent{margin-top:14px;font-size:14px;font-weight:600;color:rgba(0,0,0,.7);min-height:1.2em}
  @media (prefers-color-scheme: dark){ .brand .sub{color:rgba(245,245,245,.55)} .brand .agent{color:rgba(245,245,245,.7)} }
  main{flex:1;display:flex;flex-direction:column;align-items:center;width:100%;padding:0 16px 12px}
  .chat{width:100%;max-width:760px;flex:1;display:flex;flex-direction:column;gap:14px;padding:18px 0 24px;overflow-y:auto;min-height:200px}
  .msg{padding:12px 16px;border-radius:14px;line-height:1.5;font-size:15px;word-wrap:break-word;white-space:pre-wrap;max-width:88%}
  .msg.user{align-self:flex-end;background:#1d4ed8;color:#fff}
  .msg.ai{align-self:flex-start;background:#fff;border:1px solid rgba(0,0,0,.08);box-shadow:0 1px 2px rgba(0,0,0,.04)}
  @media (prefers-color-scheme: dark){ .msg.ai{background:#161a23;border-color:rgba(255,255,255,.08)} }
  .composer{position:sticky;bottom:36px;width:100%;max-width:760px;margin:0 auto;padding:0 0 12px}
  .composer form{display:flex;gap:8px;background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:28px;padding:8px 8px 8px 18px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
  @media (prefers-color-scheme: dark){ .composer form{background:#161a23;border-color:rgba(255,255,255,.1);box-shadow:0 6px 24px rgba(0,0,0,.4)} }
  .composer input{flex:1;border:0;outline:0;background:transparent;color:inherit;font-size:15px;font-family:inherit;padding:8px 4px}
  .composer button{appearance:none;border:0;border-radius:50%;width:38px;height:38px;background:#dc2626;color:#fff;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .composer button:disabled{background:rgba(0,0,0,.15);cursor:wait}
  @media (prefers-color-scheme: dark){ .composer button:disabled{background:rgba(255,255,255,.15)} }
  .typing{font-size:13px;color:rgba(0,0,0,.5);padding:4px 16px}
  @media (prefers-color-scheme: dark){ .typing{color:rgba(255,255,255,.5)} }
  .typing::after{content:"";display:inline-block;width:6px;height:6px;margin-left:6px;border-radius:50%;background:currentColor;animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}
  .err{color:#dc2626;background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.2);border-radius:8px;padding:8px 12px;font-size:13px;margin:8px 0;align-self:stretch}
  footer{padding:10px 12px;text-align:center;font-size:11px;color:rgba(0,0,0,.5);border-top:1px solid rgba(0,0,0,.06);flex-shrink:0;background:#fff}
  footer a{color:inherit;text-decoration:underline}
  @media (prefers-color-scheme: dark){ footer{color:rgba(255,255,255,.5);border-top-color:rgba(255,255,255,.08);background:#0b0d12} }
</style>
</head>
<body>

<div class="brand">
  <h1>RISK <em>AI</em></h1>
  <div class="sub">Personal</div>
  <div class="agent" id="agentName">&nbsp;</div>
</div>

<main>
  <div class="chat" id="chat"></div>
  <div class="composer">
    <form id="form" autocomplete="off">
      <input id="input" type="text" placeholder="Type a message and press Enter..." autofocus />
      <button id="send" type="submit" aria-label="Send">&rarr;</button>
    </form>
  </div>
</main>

<footer>
  Risk Authored by Remon Attalla &middot; Senior Security Analyst &middot;
  <a href="mailto:remon.attalla@.net">remon.attalla@.net</a> &middot;
  Built on <a href="https://github.com/khoj-ai/khoj" target="_blank" rel="noopener">Khoj</a> (AGPL-3.0) &middot;
  <a href="https://github.com/rayattalla/risk-app" target="_blank" rel="noopener">Source</a>
</footer>

<script>
// ============================================================
// Adapted risk-chat.html for Google Apps Script Web App
// This is a direct port of the original from risk-app.
// It expects the GAS Web App to be deployed and the URL to be used as base.
// For ?agent=slug it will call the GAS endpoints.
// ============================================================

(function(){
  const BASE = ''; // When served from the same GAS web app, relative is fine. Or put the full /exec URL here if needed.
  const params = new URLSearchParams(location.search);
  const agentSlug = params.get("agent");
  const chatEl = document.getElementById("chat");
  const formEl = document.getElementById("form");
  const inputEl = document.getElementById("input");
  const sendEl = document.getElementById("send");
  const agentNameEl = document.getElementById("agentName");
  let conversationId = null;
  let agentName = "";

  function addMessage(role, text){
    const el = document.createElement("div");
    el.className = "msg " + role;
    el.textContent = text;
    chatEl.appendChild(el);
    chatEl.scrollTop = chatEl.scrollHeight;
    return el;
  }
  function addError(text){
    const el = document.createElement("div");
    el.className = "err";
    el.textContent = text;
    chatEl.appendChild(el);
    chatEl.scrollTop = chatEl.scrollHeight;
  }
  function addTyping(){
    const el = document.createElement("div");
    el.className = "typing";
    el.id = "typing";
    el.textContent = "Thinking";
    chatEl.appendChild(el);
    chatEl.scrollTop = chatEl.scrollHeight;
    return el;
  }
  function removeTyping(){
    const el = document.getElementById("typing");
    if(el) el.remove();
  }

  // For the GAS port we start with non-streaming for simplicity (GAS streaming is limited).
  // The original delimiter logic is kept as comment for future upgrade.
  // const DELIM = "␃🔚␗";

  async function init(){
    if(!agentSlug){
      agentNameEl.textContent = "(no agent in URL: append ?agent=<slug>)";
      inputEl.disabled = true; sendEl.disabled = true;
      return;
    }
    try{
      // Call the GAS backend (doGet with action or use google.script.run if HtmlService)
      // For a pure Web App deployed as /exec we use fetch to the same origin + parameters.
      const agUrl = BASE + '?action=getAgent&slug=' + encodeURIComponent(agentSlug);
      const ag = await fetch(agUrl, {credentials: 'same-origin'});
      if(ag.ok){
        const data = await ag.json();
        agentName = data.name || agentSlug;
        agentNameEl.textContent = "Talking with " + agentName;
        document.title = "Risk AI · " + agentName;
      } else {
        agentNameEl.textContent = "Agent not found or access denied: " + agentSlug;
        return;
      }

      const sesUrl = BASE + '?action=createSession&slug=' + encodeURIComponent(agentSlug);
      const ses = await fetch(sesUrl, {method:"POST", credentials:"same-origin"});
      if(!ses.ok){
        addError("Could not start a chat session (HTTP " + ses.status + ").");
        return;
      }
      const sd = await ses.json();
      conversationId = sd.conversation_id;
      inputEl.focus();
    } catch(err){
      addError("Setup failed: " + err.message);
    }
  }

  async function send(text){
    addMessage("user", text);
    const aiEl = addMessage("ai", "");
    const typing = addTyping();
    inputEl.disabled = true; sendEl.disabled = true;
    let accumulated = "";

    try{
      // Non-streaming call for initial GAS version.
      // In a future iteration you can implement chunked responses.
      const chatUrl = BASE + '?action=chat';
      const res = await fetch(chatUrl, {
        method:"POST",
        credentials:"same-origin",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          q: text,
          conversation_id: conversationId
        })
      });

      if(!res.ok){
        removeTyping();
        aiEl.remove();
        addError("Chat request failed: HTTP " + res.status);
        return;
      }
      removeTyping();

      const data = await res.json();
      accumulated = data.text || "(no response)";
      aiEl.textContent = accumulated;
      chatEl.scrollTop = chatEl.scrollHeight;

    } catch(err){
      removeTyping();
      aiEl.remove();
      addError("Network error: " + err.message);
    } finally {
      inputEl.disabled = false; sendEl.disabled = false;
      inputEl.focus();
    }
  }

  // Exact same injection patterns as the original (from INJECTION_PATTERNS.js)
  const INJECTION_PATTERNS = [
    /\bignore\s+(all\s+)?(your\s+)?(previous|prior|above|the\s+above)\s+(instructions?|rules?|prompts?|messages?|directives?)\b/i,
    /\b(forget|disregard)\s+(your|the|all|previous|prior)\s+(instructions?|rules?|prompts?|training)/i,
    /\b(show|reveal|tell|give|share|expose|output|print|reproduce|repeat)\s+(me\s+)?(your\s+|the\s+|all\s+|full\s+)?(system\s+)?(prompt|instructions?|rules?|persona|guidelines?|training|configuration)\b/i,
    /\bwhat\s+(are\s+|is\s+)?(your|the)\s+(system\s+)?(instructions?|rules?|prompt|training|configuration|guidelines?|persona)\b/i,
    /\brepeat\s+(the\s+)?(text|words|content|message)\s+above\b/i,
    /\byou\s+are\s+now\s+(a|an|in)?/i,
    /\bact\s+as\s+(a|an|if|though)?/i,
    /\bpretend\s+(you\s+are|to\s+be)\b/i,
    /\bdeveloper\s+mode\b/i,
    /\bjailbreak/i,
    /\bDAN\s+mode\b/i,
    /\bswitch\s+(your\s+)?persona\b/i,
    /\bbreak\s+character\b/i,
    /\bsystem\s+message\b/i,
    /\binitial\s+prompt\b/i,
  ];
  function looksLikeInjection(text){
    for(const re of INJECTION_PATTERNS){
      if(re.test(text)) return true;
    }
    return false;
  }

  formEl.addEventListener("submit", function(e){
    e.preventDefault();
    const text = inputEl.value.trim();
    if(!text || !conversationId) return;
    inputEl.value = "";
    if(looksLikeInjection(text)){
      addMessage("user", text);
      addMessage("ai", "I'm here to help with my designated task. How can I assist you today?");
      inputEl.focus();
      return;
    }
    send(text);
  });

  init();
})();
