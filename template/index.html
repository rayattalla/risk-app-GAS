<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>RISK AI</title>
  <script>
    // NOTE: must use the UNESCAPED bang-equals scriptlet form here, not the
    // plain escaped one -- the escaped form HTML-entity-encodes quotes,
    // which corrupts JSON.stringify() output sitting inside a script block
    // (script content is never entity-decoded by the browser). GAS's
    // template compiler scans this whole file for scriptlet delimiters as
    // raw text, even inside comments -- do not write the literal delimiter
    // characters in a comment, or it gets parsed as a real (empty) scriptlet
    // and breaks compilation.
    var SHELL_VERSION = <?!= JSON.stringify(SHELL_VERSION) ?>;

|          var WEBAPP_URL = <?!= JSON.stringify(WEBAPP_URL) ?>;
|          var ORG_NAME = <?!= JSON.stringify(ORG_NAME) ?>;
|          var PROGRAM_SHORT = <?!= JSON.stringify(PROGRAM_SHORT) ?>;
|          var AGENT_SLUG = <?!= JSON.stringify(AGENT_SLUG) ?>;
|          var ADMIN_EMAIL = <?!= JSON.stringify(ADMIN_EMAIL) ?>;
|        </script>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;padding:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#fafafa;color:#0a0a0a;height:100%}
    @media (prefers-color-scheme: dark){ html,body{background:#0b0d12;color:#f5f5f5} }
    body{display:flex;flex-direction:column;min-height:100vh}
    .brand{padding:36px 16px 8px;text-align:center;flex-shrink:0}
    .brand-marks{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px}
    .brand .seal{width:56px;height:56px;display:block}
    .brand .logo{width:44px;height:44px;display:none}
    body.view-chat .brand .logo{display:block}
    .brand h1{margin:0;font-size:64px;font-weight:900;letter-spacing:-3.5px;line-height:1}
    .brand h1 .risk{color:#1F3864}
    .brand h1 em{font-style:normal;color:#dc2626}
    .brand .sub{margin-top:8px;font-size:11px;font-weight:700;letter-spacing:6px;color:rgba(0,0,0,.55);text-transform:uppercase}
    .brand .agent{margin-top:14px;font-size:14px;font-weight:600;color:rgba(0,0,0,.7);min-height:1.2em}
    @media (prefers-color-scheme: dark){ .brand .sub{color:rgba(245,245,245,.55)} .brand .agent{color:rgba(245,245,245,.7)} }
    main{flex:1;display:flex;flex-direction:column;align-items:center;width:100%;padding:0 16px 12px}
    .chat{width:100%;max-width:760px;flex:1;display:flex;flex-direction:column;gap:14px;padding:18px 0 24px;overflow-y:auto;min-height:200px}
    .msg{padding:12px 16px;border-radius:14px;line-height:1.5;font-size:15px;word-wrap:break-word;white-space:pre-wrap;max-width:88%}
    .msg.user{align-self:flex-end;background:#1d4ed8;color:#fff}
    .msg.ai{align-self:flex-start;background:#fff;border:1px solid rgba(0,0,0,.08);box-shadow:0 1px 2px rgba(0,0,0,.04)}
    @media (prefers-color-scheme: dark){ .msg.ai{background:#161a23;border-color:rgba(255,255,255,.08)} }
    .composer{position:sticky;bottom:36px;width:100%;max-width:760px;margin:0 auto;padding:0 0 12px}
    .composer form{display:flex;gap:8px;background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:28px;padding:8px 8px 8px 18px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
    @media (prefers-color-scheme: dark){ .composer form{background:#161a23;border-color:rgba(255,255,255,.1);box-shadow:0 6px 24px rgba(0,0,0,.4)} }
    .composer input{flex:1;border:0;outline:0;background:transparent;color:inherit;font-size:15px;font-family:inherit;padding:8px 4px}
    .composer button{appearance:none;border:0;border-radius:50%;width:38px;height:38px;background:#dc2626;color:#fff;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1}
    .composer button:disabled{background:rgba(0,0,0,.15);cursor:wait}
    @media (prefers-color-scheme: dark){ .composer button:disabled{background:rgba(255,255,255,.15)} }
    .typing{font-size:13px;color:rgba(0,0,0,.5);padding:4px 16px}
    @media (prefers-color-scheme: dark){ .typing{color:rgba(255,255,255,.5)} }
    .typing::after{content:"";display:inline-block;width:6px;height:6px;margin-left:6px;border-radius:50%;background:currentColor;animation:pulse 1.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}
    .err{color:#dc2626;background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.2);border-radius:8px;padding:8px 12px;font-size:13px;margin:8px 0;align-self:stretch}
    .agentlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;width:100%;max-width:760px}
    .agentcard{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:10px;padding:14px 16px;cursor:pointer;text-align:left;font-family:inherit;color:inherit}
    .agentcard:hover{border-color:#dc2626}
    @media (prefers-color-scheme: dark){ .agentcard{background:#161a23;border-color:rgba(255,255,255,.08)} }
    .agentcard .name{font-weight:700;font-size:15px}
    .agentcard .slug{font-size:11px;color:rgba(0,0,0,.5);margin-top:2px;font-family:ui-monospace,monospace}
    @media (prefers-color-scheme: dark){ .agentcard .slug{color:rgba(255,255,255,.5)} }
    footer{padding:10px 12px;text-align:center;font-size:11px;color:rgba(0,0,0,.5);border-top:1px solid rgba(0,0,0,.06);flex-shrink:0;background:#fff}
    footer a{color:inherit;text-decoration:underline}
    .chat-page-footer{display:none;text-align:center;font-size:12px;padding:4px 0 10px;color:rgba(0,0,0,.55)}
    body.view-chat .chat-page-footer{display:block}
    .chat-page-footer a{color:#1F3864;text-decoration:underline;font-weight:600}
    @media (prefers-color-scheme: dark){ footer{color:rgba(255,255,255,.5);border-top-color:rgba(255,255,255,.08);background:#0b0d12} .chat-page-footer{color:rgba(245,245,245,.55)} .chat-page-footer a{color:#8FA4C8} }
  </style>
</head>
<body class="view-list">
  <div class="brand">
    <div class="brand-marks">
      <!-- Typographic LAUSD stand-in (house navy). Official seal was not in-repo; see template/assets/README.md. -->
      <svg class="seal" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="56" height="56" role="img" aria-label="LAUSD">
        <circle cx="32" cy="32" r="31" fill="#1F3864"/>
        <circle cx="32" cy="32" r="26.5" fill="none" stroke="#C55A11" stroke-width="1.75"/>
        <text x="32" y="36.5" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-weight="700" letter-spacing="1.4">LAUSD</text>
      </svg>
      <!-- Existing in-repo Risk AI sparkline; shown on agent/chat headers only. -->
      <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="44" height="44" role="img" aria-label="Risk AI">
        <rect width="32" height="32" rx="6" fill="#1A237E"/>
        <path d="M6 20l4-12 4 7 3-9 5 14" fill="none" stroke="#F47B20" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="24" cy="10" r="2.2" fill="#00A3E0"/>
      </svg>
    </div>
    <h1><span class="risk">RISK</span> <em>AI</em></h1>
    <div class="sub">LAUSD Security</div>
    <div class="agent" id="agentName">&nbsp;</div>
  </div>

  <main>
    <div id="agent-list" style="display:none">
      <div style="text-align:center;margin:8px 0 16px">
        <button id="newChat" type="button" style="font-family:inherit;font-size:13px;padding:6px 14px;border-radius:20px;border:1px solid rgba(0,0,0,.15);background:#fff;cursor:pointer">+ New Chat</button>
      </div>
      <div id="agents" class="agentlist"></div>
      <p style="text-align:center;color:rgba(0,0,0,.5);font-size:12px;margin-top:18px">Pick an agent or use <code>?agent=slug</code> in the URL.</p>
    </div>

    <div id="chat-ui" style="display:none;width:100%;max-width:760px;flex:1;flex-direction:column">
      <div class="chat" id="chat"></div>
      <div class="composer">
        <form id="form" autocomplete="off">
          <input id="input" type="text" placeholder="Type a message and press Enter..." autofocus />
          <button id="send" type="submit" aria-label="Send">&rarr;</button>
        </form>
      </div>
      <div class="chat-page-footer">
        <a href="mailto:remon.attalla@lausd.net">remon.attalla@lausd.net</a>
      </div>
    </div>

    <div id="loading" style="text-align:center;color:rgba(0,0,0,.5);margin:24px 0">Loading&hellip;</div>
    <div id="err" class="err" style="display:none;width:100%;max-width:760px"></div>
  </main>

  <footer>
    LAUSD Agent Platform &middot; <span id="footer-version"></span> &middot; <a href="mailto:remon.attalla@lausd.net">remon.attalla@lausd.net</a>
  </footer>

<script>
// Injected globals from doGet via the head script block (var declarations).
// Do NOT redeclare AGENT_SLUG (or other injected vars) as const/let here --
// that causes SyntaxError at parse time and prevents init() from running.
// Read them via typeof checks into new local names instead.
const _INJECTED_AGENT_SLUG = (typeof AGENT_SLUG !== 'undefined' && AGENT_SLUG) ? AGENT_SLUG : '';
const _INJECTED_WEBAPP_URL = (typeof WEBAPP_URL !== 'undefined' && WEBAPP_URL) ? WEBAPP_URL : '';

const chatEl = () => document.getElementById('chat');
const formEl = () => document.getElementById('form');
const inputEl = () => document.getElementById('input');
let currentSlug = _INJECTED_AGENT_SLUG;
let history = [];
let agentInfo = null;
let sending = false;

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function showError(msg) {
  const e = document.getElementById('err');
  if (e) { e.textContent = msg; e.style.display = 'block'; }
}
function clearError() {
  const e = document.getElementById('err');
  if (e) e.style.display = 'none';
}
function setLoading(on) {
  const el = document.getElementById('loading');
  if (el) el.style.display = on ? 'block' : 'none';
}

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
  div.textContent = text;
  chatEl().appendChild(div);
  chatEl().scrollTop = chatEl().scrollHeight;
}

function addTyping() {
  const el = document.createElement('div');
  el.className = 'typing';
  el.id = 'typing';
  el.textContent = 'Thinking';
  chatEl().appendChild(el);
  chatEl().scrollTop = chatEl().scrollHeight;
  return el;
}
function removeTyping() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

function renderAgentHeader(info) {
  document.getElementById('agentName').textContent = (info && info.name) ? info.name : (currentSlug || '');
}

function renderAgentList(agents) {
  const container = document.getElementById('agents');
  container.innerHTML = '';
  (agents || []).forEach(a => {
    const card = document.createElement('div');
    card.className = 'agentcard';
    const slug = String(a.slug || '');
    const name = escapeHtml(a.name || slug);
    card.innerHTML = '<div class="name">' + name + '</div>' +
      '<div class="slug">' + escapeHtml(slug) + '</div>';
    card.onclick = () => {
      const url = (_INJECTED_WEBAPP_URL.split('?')[0] || '') + '?agent=' + encodeURIComponent(slug);
      history = [];
      window.history.replaceState(null, '', url);
      loadAgent(slug);
    };
    container.appendChild(card);
  });
}
function loadAgentList() {
  setLoading(true);
  clearError();
  var watchdog = setTimeout(function() {
    if (!agentInfo && !currentSlug) {
      showError('Could not load agents: timeout (15s) -- check server or network');
      setLoading(false);
    }
  }, 15000);
  google.script.run
    .withSuccessHandler(function(res) {
      clearTimeout(watchdog);
      try {
        if (!res || !res.ok) {
          showError('Could not load agents: ' + (res && res.error || 'Failed to agents'));
          setLoading(false);
          return;
        }
        renderAgentList(res.agents);
        document.body.classList.remove('view-chat');
        document.body.classList.add('view-list');
        document.getElementById('agent-list').style.display = 'block';
        document.getElementById('chat-ui').style.display = 'none';
      } catch (e) {
        showError('Could not load agents: ' + e.message);
      } finally {
        setLoading(false);
      }
    })
    .withFailureHandler(function(err) {
      clearTimeout(watchdog);
      showError('Could not load agents: ' + (err && err.message || String(err) || 'unknown error from server'));
      setLoading(false);
    })
    .listAgents();
}

function loadAgent(slug) {
  if (!slug) { loadAgentList(); return; }
  setLoading(true);
  clearError();
  currentSlug = slug;
  agentInfo = null;
  document.body.classList.remove('view-list');
  document.body.classList.add('view-chat');
  document.getElementById('chat-ui').style.display = 'flex';
  document.getElementById('agent-list').style.display = 'none';
  document.getElementById('chat').innerHTML = '';
  google.script.run
    .withSuccessHandler(function(res) {
      try {
        if (!res || !res.ok || !res.agent) {
          showError('Agent load failed: ' + (res && res.error || 'Agent not available'));
          loadAgentList();
          return;
        }
        agentInfo = res.agent;
        renderAgentHeader(agentInfo);
      } catch (e) {
        showError('Agent load failed: ' + e.message);
        loadAgentList();
      } finally {
        setLoading(false);
      }
    })
    .withFailureHandler(function(err) {
      showError('Agent load failed: ' + (err && err.message || String(err) || 'unknown error'));
      loadAgentList();
      setLoading(false);
    })
    .getAgent(slug);
}
// Narrow, high-confidence injection/jailbreak patterns only.
// Broad patterns (act as, you are now, system message, pretend, initial prompt)
// are removed: in a security tool they produce false positives on legitimate
// vocabulary ("MFA act as a compensating control", "system message logs").
// This filter is a UX nicety, not load-bearing -- the persona and the
// server-side prompt construction are the real defense.
const INJECTION_PATTERNS = [
  /\bignore\s+(all\s+)?(your\s+)?(previous|prior|above|the\s+above)\s+(instructions?|rules?|prompts?|messages?|directives?)\b/i,
  /\b(forget|disregard)\s+(your|the|all|previous|prior)\s+(instructions?|rules?|prompts?|training)/i,
  /\b(show|reveal|tell|give|share|expose|output|print|reproduce|repeat)\s+(me\s+)?(your\s+|the\s+|all\s+|full\s+)?(system\s+)?(prompt|instructions?|rules?|persona|guidelines?|training|configuration)\b/i,
  /\bwhat\s+(are\s+|is\s+)?(your|the)\s+(system\s+)?(instructions?|rules?|prompt|training|configuration|guidelines?|persona)\b/i,
  /\brepeat\s+(the\s+)?(text|words|content|message)\s+above\b/i,
  /\bdeveloper\s+mode\b/i,
  /\bjailbreak\b/i,
  /\bDAN\s+mode\b/i,
  /\bswitch\s+(your\s+)?persona\b/i,
  /\bbreak\s+character\b/i,
];
function looksLikeInjection(text) {
  for (const re of INJECTION_PATTERNS) { if (re.test(text)) return true; }
  return false;
}

async function send(text) {
  if (sending) return;
  if (!currentSlug || !text.trim()) return;
  sending = true;
  const btn = document.getElementById('send');
  if (btn) { btn.disabled = true; }
  addMessage('user', text);
  history.push({ role: 'user', content: text });
  document.getElementById('input').value = '';
  addTyping();
  clearError();

  try {
    const res = await new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .sendMessage(currentSlug, history, text);
    });
    removeTyping();
    if (!res || !res.ok) throw new Error(res && res.error || 'No reply');
    const reply = res.reply || '(no response)';
    addMessage('ai', reply);
    history.push({ role: 'assistant', content: reply });
  } catch (e) {
    removeTyping();
    addMessage('ai', 'Error: ' + e.message);
  } finally {
    sending = false;
    if (btn) btn.disabled = false;
    document.getElementById('input').focus();
  }
}

function newChat() {
  history = [];
  const slug = currentSlug;
  if (slug) {
    const url = (_INJECTED_WEBAPP_URL.split('?')[0] || '') + '?agent=' + encodeURIComponent(slug);
    window.history.replaceState(null, '', url);
  }
  document.getElementById('chat').innerHTML = '';
  if (slug) loadAgent(slug);
  else loadAgentList();
}

function init() {
  const footer = document.getElementById('footer-version');
  if (footer) footer.textContent = (typeof SHELL_VERSION !== 'undefined' ? SHELL_VERSION : '');

  const form = document.getElementById('form');
  if (form) {
    form.addEventListener('submit', function(ev) {
      ev.preventDefault();
      const val = document.getElementById('input').value.trim();
      if (!val) return;
      if (looksLikeInjection(val)) {
        addMessage('user', val);
        addMessage('ai', 'That request looks like an attempt to change my instructions or persona, so I did not run it. ' +
          'I am happy to help with my designated task -- could you rephrase what you actually need?');
        google.script.run.withSuccessHandler(function() {}).withFailureHandler(function() {})
          .logBlockedAttempt(currentSlug, val);
        return;
      }
      send(val);
    });
  }
  const newChatBtn = document.getElementById('newChat');
  if (newChatBtn) newChatBtn.onclick = newChat;

  if (_INJECTED_AGENT_SLUG) {
    loadAgent(_INJECTED_AGENT_SLUG);
  } else {
    loadAgentList();
  }
  document.getElementById('input').focus();
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
